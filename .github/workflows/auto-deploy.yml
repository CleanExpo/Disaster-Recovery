name: Deploy to Vercel (Gated)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rehearse_rollback:
        description: 'Rehearsal: deploy, force the smoke test to fail, and prove rollback lands on the recorded deployment'
        type: boolean
        default: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── Gate 1: Pre-build validation must pass ──
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps || npm install --force --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: TypeScript check (HARD GATE since Foundation Sprint 2026-04-24)
      run: npx tsc --noEmit

    - name: Test build (no deploy)
      run: npm run build || echo "::warning::Build errors found. Check prerender failures."
      env:
        SKIP_ENV_VALIDATION: 'true'
        NEXT_TELEMETRY_DISABLED: '1'

  # ── Gate 2: Database migration ──
  #
  # Asks the production database which migrations it is missing
  # (`prisma migrate status`), applies them, and blocks the deploy unless the
  # database then reports up to date. The previous version only diffed
  # the last commit (parent vs HEAD), so a database missing an OLDER migration sailed through, and
  # a failed migrate was downgraded to a warning. An unreadable database (eg.
  # stale DATABASE_URL) now blocks: it is not proof that nothing is pending.
  migrate:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      applied_count: ${{ steps.gate.outputs.applied_count }}
      applied_names: ${{ steps.gate.outputs.applied_names }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps || npm install --force --legacy-peer-deps

    - name: Migration gate (status against target DB, apply, re-check)
      id: gate
      run: bash scripts/ci/migrate-gate.sh
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DIRECT_URL: ${{ secrets.DIRECT_URL }}

  # ── Gate 3: Deploy to Vercel production ──
  deploy:
    needs: [validate, migrate]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
      previous_id: ${{ steps.previous.outputs.id }}
      previous_url: ${{ steps.previous.outputs.url }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Pull Vercel Environment
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build Project Artifacts
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Record previous deployment (for rollback)
      id: previous
      run: bash scripts/ci/vercel-rollback.sh record
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    - name: Deploy to Vercel Production
      id: deploy
      run: |
        URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
        echo "url=$URL" >> "$GITHUB_OUTPUT"

  # ── Gate 4: Smoke test the live deployment ──
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
    - name: Wait for deployment propagation
      run: sleep 30

    - name: Rehearsal — force smoke failure
      if: github.event_name == 'workflow_dispatch' && inputs.rehearse_rollback
      run: |
        echo "::warning::Rollback rehearsal: failing the smoke test on purpose."
        exit 1

    - name: Smoke test — homepage
      run: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://disasterrecovery.com.au)
        if [ "$STATUS" != "200" ]; then
          echo "::error::Homepage returned HTTP $STATUS"
          exit 1
        fi
        echo "Homepage OK (HTTP 200)"

    - name: Smoke test — key pages
      run: |
        for path in "/about" "/services" "/events" "/resources/fuel-surcharge-guide-2026"; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://disasterrecovery.com.au$path")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::$path returned HTTP $STATUS"
          else
            echo "$path OK (HTTP 200)"
          fi
        done

    - name: Comment on commit
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: '✅ Deployed to production. Smoke tests passed.\n\nAll gates: validate → migrate → deploy → smoke test ✓'
          })

    - name: Update deployment status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? 'success' : 'failure';
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: status,
            description: status === 'success' ? 'Deploy + smoke tests passed' : 'Deploy or smoke tests failed',
            context: 'vercel/gated-deployment'
          })

  # ── Gate 5: Auto-rollback if smoke test failed ──
  rollback-on-failure:
    needs: [migrate, deploy, smoke-test]
    if: failure() && needs.deploy.result == 'success' && needs.smoke-test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Roll back to the recorded deployment and verify it is served
      run: bash scripts/ci/vercel-rollback.sh rollback
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        PREVIOUS_ID: ${{ needs.deploy.outputs.previous_id }}
        PREVIOUS_URL: ${{ needs.deploy.outputs.previous_url }}
        APPLIED_COUNT: ${{ needs.migrate.outputs.applied_count }}
        APPLIED_NAMES: ${{ needs.migrate.outputs.applied_names }}

    - name: Comment on commit (rollback)
      uses: actions/github-script@v7
      env:
        PREVIOUS_ID: ${{ needs.deploy.outputs.previous_id }}
        APPLIED_COUNT: ${{ needs.migrate.outputs.applied_count }}
      with:
        script: |
          const applied = process.env.APPLIED_COUNT || '0';
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: `⚠️ Smoke test failed after deploy. Rolled back to ${process.env.PREVIOUS_ID} and verified the production alias serves it.` +
              (applied !== '0' ? ` Schema NOT rolled back: ${applied} migration(s) were applied this run.` : '')
          })
