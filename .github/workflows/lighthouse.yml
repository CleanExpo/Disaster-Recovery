# Lighthouse CI — CWV + Accessibility gate (DR-747 / GAP-106)
#
# Runs on every PR to main and every push to main.
# Also scheduled nightly to catch production regressions.
#
# Thresholds (configured in .lighthouserc.json):
#   LCP  > 2.5s  (mobile) — error
#   CLS  > 0.1            — error
#   INP  > 200ms           — error
#   TTI  < 0.9 score       — error
#   A11y < 0.95 score      — error
#   TBT  > 300ms           — warn
#   Perf < 0.80 score      — warn
#
# C5 (DR-700 P1, 2026-04-29): legacy-javascript / render-blocking-insight /
# uses-long-cache-ttl downgraded to warn — they double-count under
# TBT/LCP and are noisy on third-party scripts (GTM, Clarity, GA4) DR
# does not control. Hard gates (LCP, CLS, INP, TTI, A11y) unchanged.
#
# Reports uploaded as workflow artifacts for audit trail (30 day retention).

name: lighthouse

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly at 02:00 AEST (16:00 UTC)
    - cron: '0 16 * * *'

jobs:
  lighthouse:
    name: lighthouse / cwv + a11y
    runs-on: ubuntu-latest
    # Skip in fork PRs — they lack access to the production URL
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://disasterrecovery.com.au/
            https://disasterrecovery.com.au/claim
            https://disasterrecovery.com.au/events/queensland-floods-2026
            https://disasterrecovery.com.au/events/cyclone-narelle-western-australia-2026
          configPath: .lighthouserc.json
          # 3 runs per URL — median taken, reduces variance
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30
